<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการคำสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific: orders table */
    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    #ordersTable th {
      text-align: left;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: var(--cream-deep);
      padding: 1rem;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    #ordersTable td {
      padding: 1rem;
      vertical-align: top;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--line);
      overflow-wrap: anywhere;
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody tr:hover td {
      background: var(--cream);
    }

    #ordersTable td:first-child {
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Admin</span>
          <h1>รายการคำสั่งซื้อ</h1>
          <hr class="divider">
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

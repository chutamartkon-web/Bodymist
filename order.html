<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <ul class="nav">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="product.html">สินค้า</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="divider">
          <p>กรอกข้อมูลของคุณเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="form">
          <div class="form-group">
            <label for="customerName">ชื่อลูกค้า</label>
            <input class="form-control" type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label for="contact">เบอร์โทร / Line</label>
            <input class="form-control" type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์หรือ Line ID" autocomplete="tel" required>
          </div>

          <div class="form-group">
            <label for="items">รายการสินค้า</label>
            <textarea class="form-control" id="items" name="items" rows="2" placeholder="ชื่อสินค้าที่ต้องการสั่งซื้อ" required></textarea>
          </div>

          <div class="form-group">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input class="form-control" type="text" id="total" name="total" inputmode="decimal" pattern="[0-9]+(\.[0-9]+)?" title="กรุณากรอกตัวเลขเท่านั้น" placeholder="0" required>
          </div>

          <div class="form-group">
            <label for="note">หมายเหตุ</label>
            <textarea class="form-control" id="note" name="note" placeholder="ที่อยู่จัดส่งหรือข้อความอื่นๆ (ถ้ามี)"></textarea>
          </div>

          <button type="submit" class="btn btn--solid btn--block mt-3">ยืนยันสั่งซื้อ</button>
        </form>

        <p class="text-center mt-4"><a class="nav-link-back" href="product.html">&larr; กลับไปเลือกสินค้า</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <p>กลิ่นหอมที่สะท้อนตัวตนและมู้ดของคุณในทุกวัน</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
